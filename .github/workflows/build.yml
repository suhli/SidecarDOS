name: Build and protocol compatibility
on: [push, pull_request]
jobs:
  host:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test protocol/generate.test.mjs
      - run: node protocol/generate.mjs --check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: SidecarDOS-Host-Windows-x64
          path: target/release/sidecardos-host.exe
  ipad:
    name: iPad (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: simulator
            sdk: iphonesimulator
            destination: 'generic/platform=iOS Simulator'
            action: build-for-testing
          - target: device
            sdk: iphoneos
            destination: 'generic/platform=iOS'
            action: build
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ipad && xcodegen generate
      - name: Build iPad (${{ matrix.target }})
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project ipad/SidecarDOS.xcodeproj -scheme SidecarDOS -sdk "${{ matrix.sdk }}" -destination "${{ matrix.destination }}" -resultBundlePath build/ipad-build.xcresult CODE_SIGNING_ALLOWED=NO ${{ matrix.action }} 2>&1 | tee build/ipad-build.log
      - name: Upload iPad build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SidecarDOS-iPad-${{ matrix.target }}-build-diagnostics
          path: |
            build/ipad-build.log
            build/ipad-build.xcresult
          if-no-files-found: ignore
